<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CataCase</title>
    <style>
        body { margin: 0; padding: 0; background: #121212; color: #fff; font-family: sans-serif; text-align: center; }
        .header { background: #1f1f1f; padding: 15px; font-size: 24px; font-weight: bold; border-bottom: 2px solid #00ff00; }
        .balance { font-size: 20px; color: #00ff00; margin: 10px 0; }
        .cases-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 15px; }
        .case-card { background: #1f1f1f; border: 1px solid #333; border-radius: 8px; padding: 15px; width: 120px; cursor: pointer; transition: 0.2s; }
        .case-card:hover { border-color: #00ff00; }
        .case-icon { font-size: 40px; margin-bottom: 5px; }
        .btn { background: #00ff00; color: #000; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .inventory { margin-top: 20px; padding: 15px; background: #1f1f1f; min-height: 100px; }
        .inv-item { display: inline-block; background: #333; padding: 5px 10px; margin: 5px; border-radius: 4px; font-size: 14px; }
        #roulette { font-size: 24px; font-weight: bold; margin: 20px 0; min-height: 35px; color: #ffaa00; }
    </style>
</head>
<body>

    <div class="header">🐱 CataCase Mobile 🐱</div>
    <div class="balance">Баланс: <span id="coins">1000</span> 🐾</div>
    
    <button class="btn" onclick="getCoins()">Заработать 🐾</button>

    <h3>Доступные кейсы (15 видов):</h3>
    <div id="roulette">Нажми на кейс, чтобы открыть!</div>
    <div class="cases-container" id="cases-list"></div>

    <div class="inventory">
        <h3>Твой инвентарь котиков:</h3>
        <div id="inv-list"><i>Пока пусто...</i></div>
    </div>

    <script>
        let coins = 1000;
        let inventory = [];

        // 15 видов кейсов и коты, которые из них падают
        const cases = [
            { id: 1, name: "Обычный", price: 100, icon: "📦", drops: ["🐱 Кот-Новичок", "🐱 Серый Кот"] },
            { id: 2, name: "Бронзовый", price: 150, icon: "🥉", drops: ["🐱 Рыжий Кот", "🐱 Полосатик"] },
            { id: 3, name: "Серебряный", price: 250, icon: "🥈", drops: ["🐱 Сиамский Кот", "🐱 Ученый Кот"] },
            { id: 4, name: "Золотой", price: 500, icon: "🥇", drops: ["🐱 Кот-Магнат", "🐱 Персидский Кот"] },
            { id: 5, name: "Алмазный", price: 1000, icon: "💎", drops: ["💎 Бриллиантовый Кот", "🐱 Кот-Шейх"] },
            { id: 6, name: "Эпический", price: 1500, icon: "🔥", drops: ["🔥 Огненный Кот", "🐱 Кот-Киборг"] },
            { id: 7, name: "Мифический", price: 2000, icon: "🔮", drops: ["🔮 Космический Кот", "🐱 Кот-Призрак"] },
            { id: 8, name: "Легендарный", price: 3000, icon: "👑", drops: ["👑 Кот-Император", "🐱 Кот-Самурай"] },
            { id: 9, name: "Древний", price: 4000, icon: "📜", drops: ["🐱 Кот-Фараон", "🐱 Мумия-Кот"] },
            { id: 10, name: "Тайный", price: 5000, icon: "🕵️", drops: ["🐱 Кот-Шпион", "🐱 Агент Кот"] },
            { id: 11, name: "Неоновый", price: 6000, icon: "🌈", drops: ["🌈 Кибер-Кот", "🐱 Лазерный Кот"] },
            { id: 12, name: "Морской", price: 7000, icon: "🌊", drops: ["🐱 Кот-Пират", "🐱 Капитан Кот"] },
            { id: 13, name: "Звездный", price: 8000, icon: "⭐", drops: ["🐱 Астро-Кот", "🐱 Чужой Кот"] },
            { id: 14, name: "Теневой", price: 9000, icon: "🥷", drops: ["🐱 Кот-Ниндзя", "🐱 Демон-Кот"] },
            { id: 15, name: "CataBox Сверхсекретный", price: 15000, icon: "🐱", drops: ["🐱 БОГ-КОТ", "🌟 Создатель КатаБоксов"] }
        ];

        function initCases() {
            const container = document.getElementById("cases-list");
            cases.forEach(c => {
                let card = document.createElement("div");
                card.className = "case-card";
                card.onclick = () => openCase(c);
                card.innerHTML = `<div class="case-icon">${c.icon}</div><strong>${c.name}</strong><br><span style="color:#00ff00">${c.price} 🐾</span>`;
                container.appendChild(card);
            });
        }

        function getCoins() {
            coins += 50;
            document.getElementById("coins").innerText = coins;
        }

        function openCase(c) {
            if (coins < c.price) {
                alert("Недостаточно лапок (монет)!");
                return;
            }
            coins -= c.price;
            document.getElementById("coins").innerText = coins;
            
            let msg = document.getElementById("roulette");
            msg.innerText = "Открытие кейса... 🎰";
            
            setTimeout(() => {
                let randomDrop = c.drops[Math.floor(Math.random() * c.drops.length)];
                msg.innerText = `Выпал: ${randomDrop}! 🎉`;
                inventory.push(randomDrop);
                updateInventory();
            }, 1000);
        }

        function updateInventory() {
            const invContainer = document.getElementById("inv-list");
            invContainer.innerHTML = "";
            if (inventory.length === 0) {
                invContainer.innerHTML = "<i>Пока пусто...</i>";
                return;
            }
            inventory.forEach(item => {
                let div = document.createElement("div");
                div.className = "inv-item";
                div.innerText = item;
                invContainer.appendChild(div);
            });
        }

        initCases();
    </script>
</body>
</html>
