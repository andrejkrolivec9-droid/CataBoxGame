
name: Build CataBox Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'signing/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Prepare main.py
        run: |
          if [ ! -f main.py ]; then
            if [ -f Desktop-7.py ]; then
              cp Desktop-7.py main.py
            else
              echo "ERROR: main.py and Desktop-7.py are missing"
              exit 1
            fi
          fi

      - name: Check Buildozer configuration
        run: |
          test -f buildozer.spec
          grep -E '^[[:space:]]*(version|android.numeric_version)[[:space:]]*=' buildozer.spec

      - name: Check keystore
        run: |
          if [ ! -f signing/catabox-release.keystore ]; then
            echo "ERROR: Release keystore is missing"
            exit 1
          fi

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/signing/catabox-release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.SIGN_PASSWORD }}
          P4A_RELEASE_KEYALIAS: catabox
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          buildozer -v android release

      - name: Verify APK version
        run: |
          python -m pip install androguard
          python - <<'PY'
          import glob
          from androguard.core.apk import APK

          files = glob.glob("bin/*.apk")
          if not files:
              raise SystemExit("ERROR: No APK found")

          for path in files:
              apk = APK(path)
              name = apk.get_androidversion_name()
              code = int(apk.get_androidversion_code())

              print("APK:", path)
              print("Version name:", name)
              print("Version code:", code)

              if name != "0.2":
                  raise SystemExit("ERROR: Expected version name 0.2")

              if code <= 10211:
                  raise SystemExit(
                      "ERROR: Version code must be greater than 10211"
                  )
          PY

      - name: Verify APK signature
        run: |
          for apk in bin/*.apk; do
            if [ ! -f "$apk" ]; then
              echo "ERROR: APK not found"
              exit 1
            fi
            if [[ "$apk" == *unsigned* ]]; then
              echo "ERROR: Unsigned APK: $apk"
              exit 1
            fi
            jarsigner -verify "$apk"
          done

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CataBox-0.2-release-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
