
name: Build CataBox Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'signing/**'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Check source files
        run: |
          test -f main.py || {
            echo "ERROR: main.py is missing"
            exit 1
          }
          test -f buildozer.spec
          test -f CataBox_icon.png
          test -f bg.jpg

      - name: Check Buildozer configuration
        run: |
          grep -E '^[[:space:]]*(version|android.numeric_version)[[:space:]]*=' buildozer.spec

      - name: Check keystore
        run: |
          if [ ! -f signing/catabox-release.keystore ]; then
            echo "ERROR: Release keystore is missing"
            exit 1
          fi

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/signing/catabox-release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.SIGN_PASSWORD }}
          P4A_RELEASE_KEYALIAS: catabox
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          buildozer -v android release

      - name: Verify APK version
        run: |
          python -m pip install androguard
          python - <<'PY'
          import glob
          import re
          from androguard.core.apk import APK

          spec = open("buildozer.spec", encoding="utf-8").read()

          def get(key):
              m = re.search(
                  rf"^\s*{re.escape(key)}\s*=\s*(\S+)",
                  spec,
                  re.MULTILINE
              )
              if not m:
                  raise SystemExit(f"ERROR: '{key}' not found")
              return m.group(1)

          expected_name = get("version")
          expected_code = int(get("android.numeric_version"))
          files = glob.glob("bin/*.apk")

          if not files:
              raise SystemExit("ERROR: No APK found")

          for path in files:
              apk = APK(path)
              name = apk.get_androidversion_name()
              code = int(apk.get_androidversion_code())

              print("APK:", path)
              print("Version:", name)
              print("Version code:", code)

              if name != expected_name:
                  raise SystemExit(
                      f"Expected {expected_name}, got {name}"
                  )
              if code != expected_code:
                  raise SystemExit(
                      f"Expected {expected_code}, got {code}"
                  )
          PY

      - name: Verify APK signature
        run: |
          set -e
          for apk in bin/*.apk; do
            test -f "$apk"
            if [[ "$apk" == *unsigned* ]]; then
              echo "ERROR: Unsigned APK: $apk"
              exit 1
            fi
            jarsigner -verify "$apk"
          done

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CataBox-4.0.6-release-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
