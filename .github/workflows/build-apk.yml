name: Build CataBox Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Prepare main.py
        run: |
          if [ ! -f main.py ]; then
            if [ -f Desktop-7.py ]; then
              cp Desktop-7.py main.py
            else
              echo "ERROR: main.py and Desktop-7.py are missing"
              exit 1
            fi
          fi

      - name: Check Buildozer configuration
        run: |
          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec is missing"
            exit 1
          fi
          grep -E '^[[:space:]]*(package\.name|package\.domain|version|android\.release_artifact|android\.debug_artifact)[[:space:]]*=' buildozer.spec || true

      - name: Decode keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "Keystore decoded"
          else
            echo "No keystore secret, APK will be unsigned"
          fi

      - name: Build release APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$GITHUB_WORKSPACE/release.keystore" ]; then
            export P4A_RELEASE_KEYSTORE="$GITHUB_WORKSPACE/release.keystore"
            export P4A_RELEASE_KEYSTORE_PASSWD="$KS_PASS"
            export P4A_RELEASE_KEYALIAS="$KEY_ALIAS"
            export P4A_RELEASE_KEYALIAS_PASSWD="$KEY_PASS"
          fi
          buildozer -v android release

      - name: Show generated APK files
        if: always()
        run: |
          echo "Files in bin/:"
          ls -lah bin/ || true

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CataBox-release-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
