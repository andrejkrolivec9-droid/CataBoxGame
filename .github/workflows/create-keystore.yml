name: Create keystore (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keygen:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate keystore
        env:
          SIGN_PASSWORD: ${{ secrets.SIGN_PASSWORD }}
        run: |
          if [ -z "$SIGN_PASSWORD" ]; then echo "Add SIGN_PASSWORD secret first"; exit 1; fi
          if [ -f signing/catabox-release.keystore ]; then echo "Keystore already exists"; exit 1; fi
          mkdir -p signing
          keytool -genkeypair -keystore signing/catabox-release.keystore \
            -alias catabox -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$SIGN_PASSWORD" -keypass "$SIGN_PASSWORD" \
            -dname "CN=CataBox, O=CataBox, C=RU"

      - name: Commit keystore
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f signing/catabox-release.keystore
          git commit -m "Add release keystore [skip ci]"
          git push
